<body><!-- Inicio del contenido visible -->

<div class="dashboard"><!-- Contenedor principal -->

    <aside class="sidebar"><!-- Barra lateral de navegación -->

        <div class="sidebar-logo">GP</div><!-- Logo del sistema -->

        <h2>Estudiante</h2><!-- Rol del usuario -->

        <div class="dashboard-header"><!-- Encabezado principal -->

        <div class="table-container"><!-- Contenedor del formulario -->

            <h2>Nueva Bitácora</h2><!-- Título de la sección -->

            <div class="form-grid"><!-- Agrupa los campos del formulario -->

                <input type="date"><!-- Campo para seleccionar la fecha -->

                <input type="number" placeholder="Horas realizadas"><!-- Campo para registrar las horas -->

                <textarea placeholder="Describa las actividades realizadas"></textarea><!-- Campo para describir actividades -->

                <button class="btn-form">
                    Registrar Bitácora

            </div>

        </div><!-- Fin del formulario -->

        <br><!-- Salto de línea -->

        <div class="table-container"><!-- Contenedor de la tabla -->

            <h2>Bitácoras Registradas</h2><!-- Título de la sección -->

            <table><!-- Tabla de bitácoras -->

                <tr>
                    <th>Fecha</th><!-- Encabezado -->
                    <th>Actividad</th><!-- Encabezado -->
                    <th>Horas</th><!-- Encabezado -->
                    <th>Estado</th><!-- Encabezado -->
                </tr>

                <tr>
                    <td>10/08/2026</td><!-- Fecha registrada -->

                <tr>
                    <td>15/08/2026</td><!-- Fecha registrada -->
                    <td>Planeación de actividades</td><!-- Actividad realizada -->
                    <td>5</td><!-- Horas registradas -->
